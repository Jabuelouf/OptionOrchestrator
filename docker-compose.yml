services:
  postgres:
    image: postgres:16
    container_name: option-orchestrator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optionorch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optionorch}
      POSTGRES_DB: ${POSTGRES_DB:-optionorch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - option_orchestrator_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  option_orchestrator_pg:

